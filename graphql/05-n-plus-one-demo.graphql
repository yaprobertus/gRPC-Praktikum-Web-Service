# totalDatabaseQueries = 1 + jumlah author (N)
# relationResolverCalls = N
#
# Bukti optimasi: hapus header dan jalankan lagi.
# totalDatabaseQueries = 2 (1 root + 1 batch DataLoader)
# relationResolverCalls tetap N karena setiap parent tetap di-resolve.
